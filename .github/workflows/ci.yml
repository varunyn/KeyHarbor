name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Ultracite format & lint checks
        run: npm run check

      - name: Run backend TypeScript & lint checks
        run: npm run check:backend

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Go for the bundled credential proxy
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: false

      - name: Run test suite
        run: npm test

  native-proxy:
    name: Native Proxy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: false
      - name: Verify native proxy
        working-directory: native/agent-proxy
        run: go test ./...
      - name: Verify race safety
        if: runner.os != 'Windows'
        working-directory: native/agent-proxy
        run: go test -race ./...
